<body>
<h1>CSS GRID</h1>
<h4>we learn a new way of incorporating CSS into our html file. Using the "div" tag and adding the "style" attribute to the tag, we can give the content in that div tag a specific style as we desire.</h4>

<div style="display:grid;
grid-template-columns: 100px 100px;">
    <div style="
    background-color: lightblue;
    ">div1
    </div>
    <div style="
    background-color:red 
    ">div2<p>text</p>
    </div>
</div>

<div style="display:grid;
margin-top:10px;
grid-template-columns: 100px 100px 1fr;">
    <div style="
    background-color: lightblue;
    ">div1
    </div>
    <div style="
    background-color:red 
    ">div2<p>text</p>
    </div>
     <div style="
    background-color: lightblue;
    ">div1
    </div>
    </div>
</div>
</body>
</html>
